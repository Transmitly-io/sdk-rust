[package]
name = "transmitly"
version = "1.0.1"
edition = "2021"
rust-version = "1.75"
description = "Rust client for the Transmitly email API"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]
license = "MIT"
repository = "https://github.com/Transmitly-io/sdk-rust"
homepage = "https://transmitly.io/docs/sdks"
keywords = ["email", "transactional", "smtp", "webhooks"]
categories = ["email", "api-bindings"]

[dependencies]
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
